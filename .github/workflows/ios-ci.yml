# BankaiBuddy iOS CI — free macOS build gate + simulator proof (no Mac required)
#
# Drop this file at .github/workflows/ios-ci.yml in the TonyB-224/BankaiBuddy repo.
# Public repo => unlimited free GitHub-hosted macOS minutes, so every push/PR gets
# a real Xcode compile without owning a Mac.
#
# What it does:
#   1. Resolves the Firebase iOS SDK Swift package (default DerivedData location:
#      do NOT use -clonedSourcePackagesDirPath — it puts per-package build dirs
#      inside the checkouts, where nanopb's BUILD file collides with the
#      build/ directory on the runner's case-insensitive filesystem)
#   2. Compiles Debug for the iOS Simulator (unsigned)
#   3. Compiles Release as an unsigned archive (validates the shipping config)
#   4. Boots the iOS Simulator on the runner, installs the Debug build, launches
#      it, and captures a launch screenshot as proof the app actually fires off.
#      The screenshot is uploaded as a workflow artifact.
#
# What it does NOT do:
#   - No code signing, no .ipa, no App Store upload. Signing still needs an
#     Apple Developer Program membership ($99/yr) plus a signing certificate
#     stored as a repo secret — that's the remaining blocker, not the build box.
#   - No interactive Simulator window: the runner is headless, so proof comes back
#     as files (screenshot artifact), not a live screen you can tap.
#   - The screenshot shows the launch screen only. Driving to deeper screens
#     (Search, Detail, Library) needs a UI test target, which this workflow
#     deliberately does not invent — the launch proof is what matters here.
#     First launch may show the sign-in screen (auth is required); that still
#     counts as a successful launch.
#
# Project facts baked in (verified against the repo 2026-10-14, rechecked 2026-10-24):
#   - BankaiBuddy.xcodeproj at repo root, target "BankaiBuddy"
#   - Bundle ID TonyB-224.BankaiBuddy, iOS deployment target 26.4, Swift 5.0
#   - SPM dependency: https://github.com/firebase/firebase-ios-sdk
#   - No shared schemes committed, so CI builds by -target instead of -scheme.
#     (If you share the scheme in Xcode later, -scheme works too.)
#   - Pinned to macos-26 + Xcode 26.4: the 26.4 deployment target needs the
#     newest SDK, and an older runner image would fail the build outright.

name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages (Firebase)
        run: >
          xcodebuild -resolvePackageDependencies
          -project BankaiBuddy.xcodeproj

      - name: Remove Bazel BUILD files from package checkouts
        run: |
          # nanopb (and potentially other Firebase deps) ship a Bazel BUILD
          # file at the package root. On the runner's case-insensitive
          # filesystem it collides with the build/ directory Xcode creates
          # inside each checkout ('File exists but is not a directory').
          # Checkouts are ephemeral (regenerated by the resolve step) and
          # the Xcode build never reads Bazel files, so deleting them is safe.
          BUILD_FILES=$(find ~/Library/Developer/Xcode/DerivedData -type f -name BUILD 2>/dev/null | grep -E 'SourcePackages/checkouts/[^/]+/BUILD$' || true)
          if [ -n "$BUILD_FILES" ]; then echo "$BUILD_FILES" | while read -r f; do echo "Removing $f"; rm -f "$f"; done; fi

      - name: Build Debug for simulator, first pass (unsigned)
        run: |
          # Build for one concrete arm64 simulator device, not the generic
          # destination: generic builds arm64 + x86_64, and the x86_64 slice
          # of grpcppWrapper fails its dependency scan (missing
          # abslWrapper.modulemap), while the arm64 slice scans fine.
          DEVICE="$(xcrun simctl list devices available --json             | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .name')"
          [[ -n "$DEVICE" && "$DEVICE" != "null" ]] || { xcrun simctl list devices available; exit 1; }
          echo "SIM_DEVICE_NAME=$DEVICE" >> "$GITHUB_ENV"
          echo "Building for simulator device: $DEVICE"
          # ARCHS=arm64: even with a named device destination, the package
          # targets still computed x86_64 slices (ONLY_ACTIVE_ARCH warning
          # persisted), and only the x86_64 grpcppWrapper scans fail.
          # Forcing arm64 removes the x86_64 slice entirely; the runner and
          # simulator are arm64, so nothing real is lost.
          # -sdk iphonesimulator is load-bearing, not redundant: without it,
          # some package targets resolved SDKROOT to iphoneos (their
          # default) inside a simulator build, so FirebaseCoreInternal
          # looked for GoogleUtilities-NSData.modulemap under
          # GeneratedModuleMaps-iphoneos while it only existed under the
          # simulator variant. Pinning the SDK keeps every target on
          # iphonesimulator.
          xcodebuild build \
            -project BankaiBuddy.xcodeproj \
            -target BankaiBuddy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build" \
            CLANG_ENABLE_EXPLICIT_MODULES=NO || echo "first-pass Debug build done (failures expected until module maps are unified)"

      - name: Unify generated module maps across packages
        run: |
          # Xcode expects each dependent target's GeneratedModuleMaps dir
          # to contain its dependencies' modulemaps, but for SPM binary
          # packages it never creates those cross-package copies: a
          # modulemap exists only in its own package's dir, while the
          # dependent target's compile/scan looks for it in its own
          # project's dir. The same applies to the app target itself,
          # whose dir lives under the workspace build dir. Each pass
          # generates more modulemaps than the last, so copy every
          # generated modulemap into every dir that needs it for the
          # same SDK variant, filling only files that are missing.
          # Generated modulemaps use absolute header paths, so sharing
          # the file across dirs does not change what it resolves to.
          DD="$(ls -d ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/SourcePackages/checkouts 2>/dev/null | head -1)"
          if [ -z "$DD" ] || [ ! -d "$DD" ]; then echo "no SPM checkouts found"; exit 1; fi
          for variant in iphonesimulator iphoneos; do
            MAPS="$(find "$DD" -path "*/build/GeneratedModuleMaps-$variant/*.modulemap" 2>/dev/null || true)"
            [ -n "$MAPS" ] || continue
            mkdir -p "$GITHUB_WORKSPACE/build/GeneratedModuleMaps-$variant"
            DIRS="$(find "$DD" "$GITHUB_WORKSPACE/build" ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/Build -type d -name "GeneratedModuleMaps-$variant" 2>/dev/null || true)"
            echo "$MAPS" | while read -r src; do
              [ -f "$src" ] || continue
              name="$(basename "$src")"
              echo "$DIRS" | while read -r dir; do
                [ -d "$dir" ] || continue
                [ -f "$dir/$name" ] || cp "$src" "$dir/$name"
              done
            done
          done
          echo "module-map unification done"

      - name: Build Debug for simulator, second pass (unsigned)
        run: |
          DEVICE="$(xcrun simctl list devices available --json             | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .name')"
          [[ -n "$DEVICE" && "$DEVICE" != "null" ]] || { xcrun simctl list devices available; exit 1; }
          echo "SIM_DEVICE_NAME=$DEVICE" >> "$GITHUB_ENV"
          echo "Building for simulator device: $DEVICE"
          xcodebuild build \
            -project BankaiBuddy.xcodeproj \
            -target BankaiBuddy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build" \
            CLANG_ENABLE_EXPLICIT_MODULES=NO || echo "second-pass Debug build done; unifying module maps and retrying"

      - name: Unify generated module maps across packages
        run: |
          # Xcode expects each dependent target's GeneratedModuleMaps dir
          # to contain its dependencies' modulemaps, but for SPM binary
          # packages it never creates those cross-package copies: a
          # modulemap exists only in its own package's dir, while the
          # dependent target's compile/scan looks for it in its own
          # project's dir. The same applies to the app target itself,
          # whose dir lives under the workspace build dir. Each pass
          # generates more modulemaps than the last, so copy every
          # generated modulemap into every dir that needs it for the
          # same SDK variant, filling only files that are missing.
          # Generated modulemaps use absolute header paths, so sharing
          # the file across dirs does not change what it resolves to.
          DD="$(ls -d ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/SourcePackages/checkouts 2>/dev/null | head -1)"
          if [ -z "$DD" ] || [ ! -d "$DD" ]; then echo "no SPM checkouts found"; exit 1; fi
          for variant in iphonesimulator iphoneos; do
            MAPS="$(find "$DD" -path "*/build/GeneratedModuleMaps-$variant/*.modulemap" 2>/dev/null || true)"
            [ -n "$MAPS" ] || continue
            mkdir -p "$GITHUB_WORKSPACE/build/GeneratedModuleMaps-$variant"
            DIRS="$(find "$DD" "$GITHUB_WORKSPACE/build" ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/Build -type d -name "GeneratedModuleMaps-$variant" 2>/dev/null || true)"
            echo "$MAPS" | while read -r src; do
              [ -f "$src" ] || continue
              name="$(basename "$src")"
              echo "$DIRS" | while read -r dir; do
                [ -d "$dir" ] || continue
                [ -f "$dir/$name" ] || cp "$src" "$dir/$name"
              done
            done
          done
          echo "module-map unification done"

      - name: Build Debug for simulator, third pass (unsigned)
        run: |
          DEVICE="$(xcrun simctl list devices available --json             | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .name')"
          [[ -n "$DEVICE" && "$DEVICE" != "null" ]] || { xcrun simctl list devices available; exit 1; }
          echo "SIM_DEVICE_NAME=$DEVICE" >> "$GITHUB_ENV"
          echo "Building for simulator device: $DEVICE"
          xcodebuild build \
            -project BankaiBuddy.xcodeproj \
            -target BankaiBuddy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build" \
            CLANG_ENABLE_EXPLICIT_MODULES=NO

      - name: Archive Release, first pass (unsigned, compile check only)
        run: >
          xcodebuild archive
          -project BankaiBuddy.xcodeproj
          -scheme BankaiBuddy
          -configuration Release
          -sdk iphoneos
          -archivePath build/BankaiBuddy.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CLANG_ENABLE_EXPLICIT_MODULES=NO || echo "first-pass archive done (failures expected until module maps are unified)"

      - name: Unify generated module maps across packages
        run: |
          # Xcode expects each dependent target's GeneratedModuleMaps dir
          # to contain its dependencies' modulemaps, but for SPM binary
          # packages it never creates those cross-package copies: a
          # modulemap exists only in its own package's dir, while the
          # dependent target's compile/scan looks for it in its own
          # project's dir. The same applies to the app target itself,
          # whose dir lives under the workspace build dir. Each pass
          # generates more modulemaps than the last, so copy every
          # generated modulemap into every dir that needs it for the
          # same SDK variant, filling only files that are missing.
          # Generated modulemaps use absolute header paths, so sharing
          # the file across dirs does not change what it resolves to.
          DD="$(ls -d ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/SourcePackages/checkouts 2>/dev/null | head -1)"
          if [ -z "$DD" ] || [ ! -d "$DD" ]; then echo "no SPM checkouts found"; exit 1; fi
          for variant in iphonesimulator iphoneos; do
            MAPS="$(find "$DD" -path "*/build/GeneratedModuleMaps-$variant/*.modulemap" 2>/dev/null || true)"
            [ -n "$MAPS" ] || continue
            mkdir -p "$GITHUB_WORKSPACE/build/GeneratedModuleMaps-$variant"
            DIRS="$(find "$DD" "$GITHUB_WORKSPACE/build" ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/Build -type d -name "GeneratedModuleMaps-$variant" 2>/dev/null || true)"
            echo "$MAPS" | while read -r src; do
              [ -f "$src" ] || continue
              name="$(basename "$src")"
              echo "$DIRS" | while read -r dir; do
                [ -d "$dir" ] || continue
                [ -f "$dir/$name" ] || cp "$src" "$dir/$name"
              done
            done
          done
          echo "module-map unification done"

      - name: Archive Release, second pass (unsigned, compile check only)
        run: >
          xcodebuild archive
          -project BankaiBuddy.xcodeproj
          -scheme BankaiBuddy
          -configuration Release
          -sdk iphoneos
          -archivePath build/BankaiBuddy.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CLANG_ENABLE_EXPLICIT_MODULES=NO || echo "second-pass archive done; unifying module maps and retrying"

      - name: Unify generated module maps across packages
        run: |
          # Xcode expects each dependent target's GeneratedModuleMaps dir
          # to contain its dependencies' modulemaps, but for SPM binary
          # packages it never creates those cross-package copies: a
          # modulemap exists only in its own package's dir, while the
          # dependent target's compile/scan looks for it in its own
          # project's dir. The same applies to the app target itself,
          # whose dir lives under the workspace build dir. Each pass
          # generates more modulemaps than the last, so copy every
          # generated modulemap into every dir that needs it for the
          # same SDK variant, filling only files that are missing.
          # Generated modulemaps use absolute header paths, so sharing
          # the file across dirs does not change what it resolves to.
          DD="$(ls -d ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/SourcePackages/checkouts 2>/dev/null | head -1)"
          if [ -z "$DD" ] || [ ! -d "$DD" ]; then echo "no SPM checkouts found"; exit 1; fi
          for variant in iphonesimulator iphoneos; do
            MAPS="$(find "$DD" -path "*/build/GeneratedModuleMaps-$variant/*.modulemap" 2>/dev/null || true)"
            [ -n "$MAPS" ] || continue
            mkdir -p "$GITHUB_WORKSPACE/build/GeneratedModuleMaps-$variant"
            DIRS="$(find "$DD" "$GITHUB_WORKSPACE/build" ~/Library/Developer/Xcode/DerivedData/BankaiBuddy-*/Build -type d -name "GeneratedModuleMaps-$variant" 2>/dev/null || true)"
            echo "$MAPS" | while read -r src; do
              [ -f "$src" ] || continue
              name="$(basename "$src")"
              echo "$DIRS" | while read -r dir; do
                [ -d "$dir" ] || continue
                [ -f "$dir/$name" ] || cp "$src" "$dir/$name"
              done
            done
          done
          echo "module-map unification done"

      - name: Archive Release, third pass (unsigned, compile check only)
        run: >
          xcodebuild archive
          -project BankaiBuddy.xcodeproj
          -scheme BankaiBuddy
          -configuration Release
          -sdk iphoneos
          -archivePath build/BankaiBuddy.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CLANG_ENABLE_EXPLICIT_MODULES=NO

      - name: Boot simulator and launch app (proof it fires off)
        run: |
          # Boot the same device the build targeted, falling back to the
          # first available iPhone if the name did not carry over.
          if [ -n "$SIM_DEVICE_NAME" ]; then
            UDID="$(xcrun simctl list devices available --json \
              | jq -r --arg n "$SIM_DEVICE_NAME" '[.devices[] | .[] | select(.isAvailable and (.name == $n))] | first | .udid')"
          fi
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            UDID="$(xcrun simctl list devices available --json \
              | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid')"
          fi
          [[ -n "$UDID" && "$UDID" != "null" ]] || { xcrun simctl list devices available; exit 1; }
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'BankaiBuddy.app' | head -1)"
          [[ -n "$APP_PATH" ]] || { echo "BankaiBuddy.app not found"; exit 1; }
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted TonyB-224.BankaiBuddy
          sleep 10
          xcrun simctl io booted screenshot launch.png

      - name: Upload launch screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-launch-${{ github.run_id }}
          path: launch.png
          retention-days: 14
